stages:
  preprocess:
    cmd: python scripts/preprocess_data.py --input Data/sales_data.csv --output Data/processed --test-ratio 0.2
    deps:
      - Data/sales_data.csv
      - scripts/preprocess_data.py
    params:
      - params.yaml:
          - data.test_ratio
    outs:
      - Data/processed/train.parquet
      - Data/processed/test.parquet

  train:
    cmd: python save_model.py --input Data/processed/train.parquet --output models/holt_winters_model.joblib
    deps:
      - Data/processed/train.parquet
      - src/demand_forecast_engine/models/save_model.py
      - src/demand_forecast_engine/models/holt_winters.py
    params:
      - params.yaml:
          - model.trend
          - model.seasonal
          - model.seasonal_periods
          - model.use_log
    outs:
      - models/holt_winters_model.joblib

  evaluate:
    cmd: python evaluate.py --input Data/processed/test.parquet --output reports/metrics.json
    deps:
      - Data/processed/test.parquet
      - models/holt_winters_model.joblib
      - evaluate.py
    metrics:
      - reports/metrics.json
