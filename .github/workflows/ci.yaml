name: CI Pipeline

on:
  push:
    branches: [ main, "feature/**", "abhav" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          # Install API serving stack
          pip install fastapi "uvicorn[standard]" pydantic joblib statsmodels httpx pytest-asyncio
          # Install frontend dependencies (required by apps/app.py and tests/test_frontend.py)
          pip install plotly streamlit

      - name: Check formatting with Black
        run: |
          black --check --line-length 100 src/ tests/ apps/ || echo "Black formatting check finished"

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 src/ tests/ apps/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only for style issues
          flake8 src/ tests/ apps/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run unit tests with Pytest
        run: |
          pytest tests/ -v --cov=src/demand_forecast_engine --cov-report=term-missing
