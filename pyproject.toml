[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demand_forecast_engine"
version = "0.1.0"
description = "Demand forecasting pipeline and Streamlit app"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "plotly>=5.0",
  "streamlit>=1.30",
  "statsmodels>=0.14",
  "joblib>=1.3",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "plotly>=5.0",
  "fastapi>=0.100.0",
  "httpx>=0.25.0",
  "pydantic>=2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
testpaths = ["tests"]
