schema: '2.0'
stages:
  preprocess:
    cmd: python scripts/preprocess_data.py --input Data/sales_data.csv --output Data/processed --test-ratio 0.2
    deps:
      - path: Data/sales_data.csv
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
      - path: scripts/preprocess_data.py
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
    params:
      params.yaml:
        data.test_ratio: 0.2
    outs:
      - path: Data/processed/train.parquet
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
      - path: Data/processed/test.parquet
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0

  train:
    cmd: python save_model.py --input Data/processed/train.parquet --output models/holt_winters_model.joblib
    deps:
      - path: Data/processed/train.parquet
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
      - path: src/demand_forecast_engine/models/holt_winters.py
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
      - path: src/demand_forecast_engine/models/save_model.py
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
    params:
      params.yaml:
        model.seasonal: add
        model.seasonal_periods: 7
        model.trend: add
        model.use_log: true
    outs:
      - path: models/holt_winters_model.joblib
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0

  evaluate:
    cmd: python evaluate.py --input Data/processed/test.parquet --output reports/metrics.json
    deps:
      - path: Data/processed/test.parquet
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
      - path: evaluate.py
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
      - path: models/holt_winters_model.joblib
        hash: md5
        md5: 00000000000000000000000000000000
        size: 0
    metrics:
      - path: reports/metrics.json
        md5: 00000000000000000000000000000000
        size: 0
