# Parameters for the DVC pipeline and Holt-Winters model.
# Use a single canonical path layout aligned with the project dataset.

paths:
  raw_data: Data/sales_data.csv
  clean_data: Data/processed/clean.parquet
  processed_dir: Data/processed
  train_data: Data/processed/train.parquet
  test_data: Data/processed/test.parquet
  category_maps: Data/processed/category_maps.json

# Input dataset contract — used by validate_schema in preprocess.py
schema:
  date: [Date]
  string: [Store ID, Product ID, Category, Region]
  numeric: [Price, Demand, Promotion]

# Input dataset contract
data:
  date_col: Date
  date_format: "%d-%m-%Y"
  target_col: Demand
  id_cols: ["Store ID", "Product ID", "Category", "Region"]
  group_cols: ["Store ID", "Product ID", "Category", "Region"]
  test_ratio: 0.2

# Preprocessing settings
preprocess:
  ffill_cols: [Demand]
  log1p_cols: [Demand]
  max_null_fraction: 0.05
  require_continuous_dates: true

# Feature engineering settings — used by feature_engineer.py
features:
  target_col: Demand
  test_ratio: 0.2
  train_cutoff_date: null
  calendar: [dayofweek, month, week, is_weekend]
  lag_cols: [Demand]
  lag_days: [1, 7, 14]
  rolling_cols: [Demand]
  rolling_windows: [7, 14]
  rolling_stats: [mean, std]
  categorical_features: [Category, Region]
  drop_cols: []

# Model tuning settings used by the Holt-Winters stage
model:
  trend: add
  seasonal: add
  seasonal_periods: 7
  use_log: true
  horizon: 14
